name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Assinar APK com keystore fixa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          APK_PATH=$(ls bin/*.apk | head -n 1)
          echo "Assinando APK: $APK_PATH"

          if [ ! -f "controle_frete.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore controle_frete.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=ControleFrete, OU=Mobile, O=Almir, L=Curitiba, ST=PR, C=BR"
          fi

          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$HOME/.buildozer/android/platform/android-sdk}/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" sign \
              --ks controle_frete.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "env:KEYSTORE_PASSWORD" \
              --key-pass "env:KEY_PASSWORD" \
              "$APK_PATH"
          else
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore controle_frete.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$APK_PATH" \
              "$KEY_ALIAS"
          fi

      - name: Salvar keystore no repositorio
        run: |
          if [ -f "controle_frete.keystore" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add controle_frete.keystore
            if ! git diff --cached --quiet; then
              git commit -m "Salvar keystore fixa para atualizacoes do APK"
              git push
            fi
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Primeiro-App-APK
          path: bin/*.apk
          if-no-files-found: error
